<svg xmlns="http://www.w3.org/2000/svg" width="760" height="160" viewBox="0 0 760 160" role="img" aria-label="Loading"><style>*{transform-box:view-box}.l1{transform-origin:32px 69px}.l2{transform-origin:22px 65px}.l3{transform-origin:12px 69px}.r1{transform-origin:32px 91px}.r2{transform-origin:22px 95px}.r3{transform-origin:12px 91px}.al{transform-origin:50px 75.5px}.ar{transform-origin:50px 84.5px}.bug{transform-origin:22px 80px}
@keyframes walk{from{transform:translateX(-64px)}to{transform:translateX(760px)}}
@keyframes stepA{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes stepB{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes feelL{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
@keyframes feelR{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-6deg)}}
@keyframes lit{0%,12%{stroke:#e8492a;stroke-opacity:1;fill:#e8492a;fill-opacity:.07}32%,100%{stroke:#16161a;stroke-opacity:.26;fill:#16161a;fill-opacity:.03}}
@keyframes litLn{0%,12%{fill:#e8492a;fill-opacity:1}32%,100%{fill:#16161a;fill-opacity:.16}}
.walker{animation:walk 2s linear infinite}
.bug{animation:sway .2s ease-in-out infinite}
.leg.a{animation:stepA .2s ease-in-out infinite}
.leg.b{animation:stepB .2s ease-in-out infinite}
.al{animation:feelL .4s ease-in-out infinite}
.ar{animation:feelR .4s ease-in-out infinite .06s}
.pg{stroke:#16161a;stroke-opacity:.26;fill:#16161a;fill-opacity:.03;stroke-width:2;animation:lit 2s linear infinite}
.ln{fill:#16161a;fill-opacity:.16;animation:litLn 2s linear infinite}
.im{fill:#16161a;fill-opacity:.08}
.p0 .pg,.p0 .ln{animation-delay:0.126s}.p1 .pg,.p1 .ln{animation-delay:0.417s}.p2 .pg,.p2 .ln{animation-delay:0.709s}.p3 .pg,.p3 .ln{animation-delay:1.000s}.p4 .pg,.p4 .ln{animation-delay:1.291s}.p5 .pg,.p5 .ln{animation-delay:1.583s}
