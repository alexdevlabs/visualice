<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture App</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 16px;
        background: #f4f4f4;
      }
      nav a {
        margin-right: 12px;
      }
      dialog {
        border: 2px solid #333;
      }
    </style>
  </head>
  <body>
    <nav><a href="#/">Home</a><a href="#/settings">Settings</a></nav>
    <main id="view"></main>
    <button id="show-dialog">Open dialog</button>
    <button id="save" aria-label="Save draft">💾</button>
    <dialog id="dlg">
      <p>A dialog inside the app</p>
      <button id="close">Close</button>
    </dialog>
    <script>
      const $ = (id) => document.getElementById(id);
      const render = () => {
        $("view").innerHTML =
          location.hash === "#/settings" ? "<h1>Settings</h1>" : "<h1>Home</h1>";
      };
      addEventListener("hashchange", render);
      render();
      $("show-dialog").onclick = () => $("dlg").showModal();
      $("close").onclick = () => $("dlg").close();
      // A write to the app's backend: discovery must block it and leave the button out.
      $("save").onclick = () =>
        fetch("https://api.example.com/drafts", { method: "POST", body: "{}" }).catch(() => {});
    </script>
  </body>
</html>
