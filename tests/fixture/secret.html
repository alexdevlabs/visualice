<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture — Members area</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
        display: grid; place-items: center; min-height: 100vh; text-align: center; }
      h1 { font-size: 30px; }
      .locked { color: #f87171; }
      .ok { color: #34d399; }
    </style>
  </head>
  <body>
    <h1 id="status">…</h1>
    <script>
      const user = localStorage.getItem("vc_user");
      const el = document.getElementById("status");
      if (user) {
        el.textContent = "Welcome back, " + user;
        el.className = "ok";
      } else {
        el.textContent = "Please log in";
        el.className = "locked";
      }
    </script>
  </body>
</html>
