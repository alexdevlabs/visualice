# Visual regression check for pull requests.
#
# Crawls the site your PR builds, compares it with the approved baseline, comments
# the result on the PR and fails the job when something changed. Copy this file to
# .github/workflows/ in your project and adjust the two "your app" steps.
#
# The baseline lives in the repo (baseline.dir in visualice.config.json points at a
# committed folder, e.g. "visual-baseline"), so a PR that changes the UI on purpose
# updates it in the same PR:
#
#   npx visualice crawl && npx visualice approve && git add visual-baseline
#
# Prefer not to commit images? Keep the default baseline location and restore it with
# actions/cache keyed on the base branch instead, approving on pushes to main.
name: Visual regression

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # --- your app: build it and serve it on localhost -------------------------
      - run: npm run build
      - run: npm run preview -- --port 4173 &
      - run: npx wait-on http://localhost:4173
      # --------------------------------------------------------------------------

      - run: npx visualice doctor
      - run: npx visualice crawl http://localhost:4173 --no-save --fail-on-error --quiet

      - name: Compare with the approved baseline
        id: diff
        # Exit 3 means "differences found": keep going so the report still gets
        # posted, and fail the job at the end.
        run: |
          set +e
          npx visualice diff --from=baseline --fail-on-error --quiet
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat .visualice/diffs/*/diff-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always() && steps.diff.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file "$(ls .visualice/diffs/*/diff-summary.md | head -1)"

      # The viewer and the comparison as a static folder: download the artifact,
      # serve it with any file server (npx serve visual-report) and review the
      # changes side by side.
      - run: npx visualice export visual-report --quiet
        if: always() && steps.diff.outputs.code != ''
      - uses: actions/upload-artifact@v4
        if: always() && steps.diff.outputs.code != ''
        with:
          name: visual-report
          path: visual-report
          retention-days: 14

      - name: Fail when something changed
        if: steps.diff.outputs.code != '0'
        run: |
          echo "::error::visualice found visual differences (or the diff failed) — see the PR comment and the visual-report artifact"
          exit 1
